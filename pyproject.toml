[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "roop"
version = "0.1.0"
description = "Roop — local autonomous coding agent engine (Phase 0 scaffold)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Minseong Kim" }]
dependencies = [
  "httpx>=0.27.0",
  "typer>=0.12.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[project.scripts]
roop = "roop.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/roop"]

[tool.hatch.build.targets.sdist]
include = ["src/roop", "tests", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
